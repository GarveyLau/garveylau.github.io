<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="692" viewBox="0 0 1200 692" role="img"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c66b20"/></marker></defs><rect width="1200" height="692" fill="#f6f8fc"/><g font-family="system-ui, -apple-system, sans-serif"><text x="48" y="60" font-size="32" fill="#172033" font-weight="700">本地 Agent 与云端 Agent：身份状态与持续在线</text><text x="48" y="98" font-size="21" fill="#536078" font-weight="400">本地接近用户已有的工作环境，云端可以在用户离开后继续运行。</text><rect x="48" y="132" width="528" height="406" rx="16" fill="#fff" stroke="#d7deea" stroke-width="2"/><text x="72" y="177" font-size="29" fill="#2563eb" font-weight="700">本地 Agent</text><text x="72" y="214" font-size="22" fill="#172033" font-weight="400">核心优势：已有身份与工作现场</text><text x="72" y="258" font-size="19" fill="#536078" font-weight="600">上下文来源</text><text x="72" y="287" font-size="22" fill="#172033" font-weight="400">本地文件、桌面应用、当前工作</text><text x="72" y="323" font-size="19" fill="#536078" font-weight="600">身份状态</text><text x="72" y="352" font-size="22" fill="#172033" font-weight="400">已有登录、桌面账号、本地网络环境</text><text x="72" y="388" font-size="19" fill="#536078" font-weight="600">运行条件</text><text x="72" y="417" font-size="22" fill="#172033" font-weight="400">设备在线、进程运行、权限已授予</text><text x="72" y="453" font-size="19" fill="#536078" font-weight="600">适用场景</text><text x="72" y="482" font-size="22" fill="#172033" font-weight="400">即时协作、本地工程与资料处理</text><rect x="624" y="132" width="528" height="406" rx="16" fill="#fff" stroke="#d7deea" stroke-width="2"/><text x="648" y="177" font-size="29" fill="#2563eb" font-weight="700">云端 Agent</text><text x="648" y="214" font-size="22" fill="#172033" font-weight="400">核心优势：24 小时在线</text><text x="648" y="258" font-size="19" fill="#536078" font-weight="600">上下文来源</text><text x="648" y="287" font-size="22" fill="#172033" font-weight="400">已授权应用、上传资料、任务记录</text><text x="648" y="323" font-size="19" fill="#536078" font-weight="600">身份状态</text><text x="648" y="352" font-size="22" fill="#172033" font-weight="400">独立环境，需要登录和连接服务</text><text x="648" y="388" font-size="19" fill="#536078" font-weight="600">运行条件</text><text x="648" y="417" font-size="22" fill="#172033" font-weight="400">托管环境可用、服务与任务额度足够</text><text x="648" y="453" font-size="19" fill="#536078" font-weight="600">适用场景</text><text x="648" y="482" font-size="22" fill="#172033" font-weight="400">异步任务、周期检查、离开后继续工作</text><rect x="48" y="562" width="1104" height="98" rx="16" fill="#eaf0fc" stroke="#c8d6f1" stroke-width="2"/><text x="72" y="601" font-size="24" fill="#172033" font-weight="600">协作关键：共享上下文，让两端接上同一件工作</text><text x="72" y="636" font-size="21" fill="#536078" font-weight="400">身份状态能否复用取决于工具；24 小时在线不代表无限执行。</text></g></svg>