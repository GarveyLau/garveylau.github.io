<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c66b20"/></marker></defs><rect width="1200" height="665" fill="#f6f8fc"/><g font-family="system-ui, -apple-system, sans-serif"><text x="48" y="60" font-size="31" fill="#172033" font-weight="700">本地与云端协作：共享任务，持续共享上下文</text><text x="48" y="98" font-size="21" fill="#536078" font-weight="400">一种建议的协作形态，不对应某家厂商的已实现架构。</text><rect x="48" y="150" width="320" height="285" rx="16" fill="#fff" stroke="#d7deea" stroke-width="2"/><rect x="832" y="150" width="320" height="285" rx="16" fill="#fff" stroke="#d7deea" stroke-width="2"/><text x="72" y="194" font-size="28" fill="#2563eb" font-weight="700">本地 Agent</text><text x="72" y="243" font-size="22" fill="#172033" font-weight="400">整理本地资料与用户要求</text><text x="72" y="286" font-size="22" fill="#172033" font-weight="400">选择任务所需上下文</text><text x="72" y="329" font-size="22" fill="#172033" font-weight="400">审阅结果、补充反馈</text><text x="72" y="390" font-size="20" fill="#536078" font-weight="400">用户与本地工作环境</text><text x="856" y="194" font-size="28" fill="#2563eb" font-weight="700">云端 Agent</text><text x="856" y="243" font-size="22" fill="#172033" font-weight="400">使用已授权的工具执行</text><text x="856" y="286" font-size="22" fill="#172033" font-weight="400">保留进度、处理任务中断</text><text x="856" y="329" font-size="22" fill="#172033" font-weight="400">返回成果、来源与进展</text><text x="856" y="390" font-size="20" fill="#536078" font-weight="400">持续存在的执行环境</text><path d="M382 226H818" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/><text x="422" y="204" font-size="22" fill="#2563eb" font-weight="600">任务 + 背景 + 最新要求</text><path d="M818 362H382" stroke="#c66b20" stroke-width="4" marker-end="url(#orange)"/><text x="440" y="341" font-size="22" fill="#a65115" font-weight="600">成果 + 来源 + 最新进展</text><rect x="399" y="258" width="402" height="47" rx="16" fill="#eaf0fc" stroke="#c8d6f1" stroke-width="2"/><text x="426" y="289" font-size="21" fill="#172033" font-weight="400">反馈与新要求 → 更新任务</text><rect x="48" y="479" width="1104" height="107" rx="16" fill="#fff" stroke="#c8d6f1" stroke-width="2"/><text x="72" y="519" font-size="24" fill="#172033" font-weight="700">共享的上下文与工作记录</text><text x="72" y="558" font-size="23" fill="#536078" font-weight="400">目标 · 资料来源 · 修改意见 · 已做决定 · 当前进展</text><text x="48" y="627" font-size="23" fill="#a65115" font-weight="600">两端的变化都要同步，避免重复解释、使用旧要求和重复执行。</text></g></svg>