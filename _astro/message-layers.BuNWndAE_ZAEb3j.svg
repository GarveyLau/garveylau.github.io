<svg xmlns="http://www.w3.org/2000/svg" width="720" height="738" viewBox="0 0 720 738" role="img" aria-labelledby="title desc">
  <title id="title">Personal Agent 的交付信息分层</title>
  <desc id="desc">用户直接看到结果、关键限制和需要决定的事。来源、差异与验证材料按需展开，工具调用、原始响应和重试细节保留在执行记录中。任何一层出现影响判断的缺口或变化，都应提到主消息中。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8" fill="none" stroke="#de712f" stroke-width="1.5" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="720" height="738" rx="24" fill="#f7f8fa"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="68" y="58" fill="#17202a" font-size="34" font-weight="700">让用户先看到结果</text>
    <rect x="68" y="92" width="604" height="148" rx="18" fill="#eaf1ff" stroke="#2b5ce6" stroke-width="2"/>
    <rect x="68" y="268" width="604" height="148" rx="18" fill="#ffffff" stroke="#c9d2df" stroke-width="2"/>
    <rect x="68" y="444" width="604" height="148" rx="18" fill="#ffffff" stroke="#c9d2df" stroke-width="2"/>
    <g fill="#17202a" font-size="30" font-weight="700">
      <text x="96" y="140">直接看到</text>
      <text x="96" y="316">按需展开</text>
      <text x="96" y="492">查看记录</text>
    </g>
    <g font-size="26">
      <text x="96" y="187" fill="#223e7c">结果、关键限制、需要决定的事</text>
      <text x="96" y="220" fill="#47618f">主消息先交代清楚</text>
      <text x="96" y="363" fill="#414e60">来源、差异、验证材料</text>
      <text x="96" y="396" fill="#627085">方便用户核验和深入了解</text>
      <text x="96" y="539" fill="#414e60">工具调用、原始响应、重试细节</text>
      <text x="96" y="572" fill="#627085">保留以便排查，按需要查看</text>
    </g>
    <path d="M68 518H36V166H59" fill="none" stroke="#de712f" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <path d="M68 342H36" fill="none" stroke="#de712f" stroke-width="3" stroke-dasharray="7 6"/>
    <rect x="68" y="624" width="604" height="78" rx="16" fill="#fff0e6"/>
    <text x="90" y="657" fill="#9e4819" font-size="26" font-weight="600">影响判断的缺口或变化</text>
    <text x="90" y="688" fill="#9e4819" font-size="26">直接写进主消息</text>
  </g>
</svg>
