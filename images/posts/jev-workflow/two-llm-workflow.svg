<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1770" viewBox="0 0 1320 1770" role="img" aria-labelledby="title"><title id="title">搜集工作日报：真实执行节点与两个模型节点</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#73849a" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;text-anchor:middle;fill:#17324d}.edge{fill:none;stroke:#73849a;stroke-width:2;marker-end:url(#arrow)}.label{font-size:17px;paint-order:stroke;stroke:#fafbfd;stroke-width:7;stroke-linejoin:round}.node{stroke-width:1.7}.sub{font-size:18px}</style><rect width="1320" height="1770" rx="18" fill="#fafbfd"/><text x="660" y="40"> </text><text x="660" y="42" font-size="29" font-weight="700">搜集工作日报</text><path class="edge" d="M625.0 143V180"/><path class="edge" d="M625.0 238V275"/><path class="edge" d="M625.0 333V370"/><path class="edge" d="M625.0 448V485"/><path class="edge" d="M625.0 543V580"/><text class="label" x="725.0" y="565.5">可继续</text><path class="edge" d="M625.0 685V730"/><text class="label" x="725.0" y="711.5">是</text><path class="edge" d="M625.0 805V850"/><path class="edge" d="M625.0 930V980"/><path class="edge" d="M625.0 1055V1110"/><path class="edge" d="M625.0 1190V1240"/><text class="label" x="725.0" y="1219.0">可保存全部或部分</text><path class="edge" d="M625.0 1298V1345"/><path class="edge" d="M625.0 1423V1480"/><text class="label" x="725.0" y="1455.5">保存已确认</text><path class="edge" d="M625.0 1558V1610"/><path class="edge" d="M430 632H187V975"/><text class="label" x="305" y="615">否</text><path class="edge" d="M187 1053V1150H430"/><path class="edge" d="M820 510H940V635H1010"/><text class="label" x="931" y="493">日期不明确</text><path class="edge" d="M820 535H975V1316H1010"/><text class="label" x="1100" y="566">跨日期修改需重查／特殊任务</text><path class="edge" d="M430 767H370V1017H430"/><text class="label" x="310" y="824">目录读取失败</text><path class="edge" d="M820 1150H905V665H1010"/><text class="label" x="917" y="1090">需要澄清</text><path class="edge" d="M820 1384H1137V1352"/><text class="label" x="1033" y="1415">写入未知／回读不一致</text><rect class="node" x="430" y="85" width="390" height="58" rx="10" fill="#f2f3f5" stroke="#8993a0"/><text x="625.0" y="121.0" font-size="20" font-weight="600">同事提交／补充／更正日报</text><rect class="node" x="430" y="180" width="390" height="58" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="625.0" y="216.0" font-size="20" font-weight="600">P1 核验原始消息与人员身份</text><rect class="node" x="430" y="275" width="390" height="58" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="625.0" y="311.0" font-size="20" font-weight="600">P2 查询对应日期的已有日报</text><rect class="node" x="430" y="370" width="390" height="78" rx="10" fill="#fff0e5" stroke="#ee8b43"/><text x="625.0" y="402.5" font-size="20" font-weight="600">L1 理解本次变更</text><text x="625.0" y="429.5" font-size="17" font-weight="400">日期、正文原文、投入、项目原话、请假</text><rect class="node" x="430" y="485" width="390" height="58" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="625.0" y="521.0" font-size="20" font-weight="600">P3 校验结构与事实来源</text><path class="node" fill="#eaf3ff" stroke="#4386d7" d="M625.0 580L820 632.5L625.0 685L430 632.5Z"/><text x="625.0" y="626.0" font-size="20" font-weight="600">本次是否明确提供</text><text x="625.0" y="653.0" font-size="17" font-weight="400">或更正项目？</text><rect class="node" x="430" y="730" width="390" height="75" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="625.0" y="761.0" font-size="20" font-weight="600">P4 查询完整项目目录</text><text x="625.0" y="788.0" font-size="17" font-weight="400">不按人员绑定过滤</text><rect class="node" x="430" y="850" width="390" height="80" rx="10" fill="#fff0e5" stroke="#ee8b43"/><text x="625.0" y="883.5" font-size="20" font-weight="600">L2 匹配项目名称</text><text x="625.0" y="910.5" font-size="17" font-weight="400">项目原话 → 正式项目</text><rect class="node" x="430" y="980" width="390" height="75" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="625.0" y="1011.0" font-size="20" font-weight="600">P5 校验候选结果</text><text x="625.0" y="1038.0" font-size="17" font-weight="400">确定项目或标记待确认</text><rect class="node" x="45" y="975" width="285" height="78" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="187.5" y="1007.5" font-size="20" font-weight="600">保留已有项目</text><text x="187.5" y="1034.5" font-size="17" font-weight="400">没有则待补</text><rect class="node" x="430" y="1110" width="390" height="80" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="625.0" y="1143.5" font-size="20" font-weight="600">P6 合并变更</text><text x="625.0" y="1170.5" font-size="17" font-weight="400">保存正文原文、计算工时、检查缺项</text><rect class="node" x="430" y="1240" width="390" height="58" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="625.0" y="1276.0" font-size="20" font-weight="600">P7 创建／更新日报</text><rect class="node" x="430" y="1345" width="390" height="78" rx="10" fill="#eaf3ff" stroke="#4386d7"/><text x="625.0" y="1377.5" font-size="20" font-weight="600">P8 独立回读</text><text x="625.0" y="1404.5" font-size="17" font-weight="400">按条件同步请假免催记录</text><rect class="node" x="430" y="1480" width="390" height="78" rx="10" fill="#f2f3f5" stroke="#8993a0"/><text x="625.0" y="1512.5" font-size="20" font-weight="600">外层 Agent 回复</text><text x="625.0" y="1539.5" font-size="17" font-weight="400">说明已记录内容，合并追问缺项</text><rect class="node" x="430" y="1610" width="390" height="75" rx="10" fill="#f2f3f5" stroke="#8993a0"/><text x="625.0" y="1641.0" font-size="20" font-weight="600">回复后复核</text><text x="625.0" y="1668.0" font-size="17" font-weight="400">按条件接续项目 Profile</text><rect class="node" x="1010" y="610" width="255" height="72" rx="10" fill="#f2f3f5" stroke="#8993a0"/><text x="1137.5" y="653.0" font-size="20" font-weight="600">外层 Agent 追问</text><rect class="node" x="1010" y="1280" width="255" height="72" rx="10" fill="#f2f3f5" stroke="#8993a0"/><text x="1137.5" y="1323.0" font-size="20" font-weight="600">外层 Agent 接手续办</text><text x="1080" y="886" font-size="21" fill="#b96123">← 本次只测 L2</text><text x="660" y="1736" font-size="17">蓝色：程序执行　橘色：模型判断　灰色：同事／外层 Agent</text></svg>